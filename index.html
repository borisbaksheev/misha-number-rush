<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Number Rush" />
    <meta name="theme-color" content="#3a9cf5" />
    <meta name="description" content="A colourful 3D maths racing game where living numbers merge, split and grow." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Misha's Number Rush</title>
  </head>
  <body>
    <div id="game" aria-label="Game view"></div>

    <div id="hud" class="hidden">
      <div class="top">
        <div class="pill" id="lap">Lap 1</div>
        <div class="number-badge" id="badge">
          <div class="value" id="value">2</div>
          <div class="words" id="words">two</div>
        </div>
        <button class="round" id="pauseBtn" aria-label="Pause">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        </button>
      </div>
      <div id="team"></div>
      <div id="equation"></div>
      <div id="banner"><div class="rays"></div><div class="text"></div></div>
      <div id="toast"></div>
      <div id="hint">
        <div class="finger"></div>
        <div id="hintText">Hold to run · Slide to steer</div>
      </div>
    </div>

    <div id="start" class="screen">
      <div class="logo">
        <div class="logo-small">Misha's</div>
        <div class="logo-big"><span>N</span><span>u</span><span>m</span><span>b</span><span>e</span><span>r</span></div>
        <div class="logo-big rush"><span>R</span><span>u</span><span>s</span><span>h</span><span>!</span></div>
      </div>
      <div class="bottom">
        <div class="modes">
          <button class="mode-btn race" id="raceBtn" aria-label="Racing">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M10 58 L26 10 L38 10 L54 58 Z" fill="#5850d8" />
              <path d="M30 16 h4 v8 h-4z M30 30 h4 v9 h-4z M29 45 h6 v10 h-6z" fill="#fff" />
              <path d="M40 6 v24" stroke="#2c1840" stroke-width="3" stroke-linecap="round" />
              <path d="M40 6 h16 v12 h-16z" fill="#fff" stroke="#2c1840" stroke-width="2" />
              <path d="M40 6 h4 v4 h-4z M48 6 h4 v4 h-4z M44 10 h4 v4 h-4z M52 10 h4 v4 h-4z M40 14 h4 v4 h-4z M48 14 h4 v4 h-4z" fill="#2c1840" />
            </svg>
            <span class="mode-name">Racing</span>
            <span class="mode-how">Hold &amp; slide to run</span>
          </button>
          <button class="mode-btn sky" id="skyBtn" aria-label="Sky Numbers">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="46" cy="16" r="9" fill="#ffd84a" />
              <path d="M14 46 a10 10 0 0 1 4-19 a13 13 0 0 1 25-2 a9 9 0 0 1 9 14 a7 7 0 0 1-2 7z" fill="#fff" stroke="#2c1840" stroke-width="2.5" stroke-linejoin="round" />
              <circle cx="27" cy="37" r="7" fill="none" stroke="#a35cff" stroke-width="4" />
              <path d="M40 34 h8 M44 30 v8" stroke="#2fd98a" stroke-width="4" stroke-linecap="round" />
            </svg>
            <span class="mode-name">Sky Numbers</span>
            <span class="mode-how">Slide to fly</span>
          </button>
        </div>
        <div class="toggles">
          <button class="toggle" id="sfxToggle" data-on="true">Sounds</button>
          <button class="toggle" id="musicToggle" data-on="true">Music</button>
        </div>
        <div class="loading" id="loading">Loading…</div>
        <div class="version" id="version"></div>
      </div>
    </div>

    <div id="pause" class="screen hidden">
      <div class="panel">
        <div class="title">Paused</div>
        <button class="big-btn" id="resumeBtn">Keep playing</button>
        <button class="mid-btn" id="restartBtn">Start again</button>
        <button class="mid-btn" id="menuBtn">Main menu</button>
        <div class="toggles">
          <button class="toggle" id="sfxToggle2" data-on="true">Sounds</button>
          <button class="toggle" id="musicToggle2" data-on="true">Music</button>
        </div>
      </div>
    </div>

    <div id="problem" class="screen hidden">
      <div class="panel">
        <div class="title" id="problemTitle">Oops!</div>
        <div class="problem-text" id="problemText"></div>
        <button class="big-btn" id="reloadBtn">Try again</button>
      </div>
    </div>

    <div id="fps" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
